  var themeDefs = {}; C.themes.forEach(function (t) { themeDefs[t.id] = t; });

  var themeById = {}; themes.forEach(function (t) { themeById[t.id] = t; });
  var clusters = (D.clusters || []).slice().sort(function (a, b) { return (b.recent - b.base) - (a.recent - a.base); });
  var qById = {}; (D.questions || []).forEach(function (q) { qById[q.id] = q; });
  var questions = C.researchQuestions.map(function (rq) { return Object.assign({ rqDef: rq }, qById[rq.id] || {}, { id: rq.id, num: rq.num }); });
  var sources = (D.sources || []).slice().sort(function (a, b) { return a.postedAt < b.postedAt ? 1 : -1; });
  var srcById = {}; sources.forEach(function (s) { srcById[s.id] = s; });
  V.scoreEngagement(sources);
  sources.forEach(function (s) { s.engScore = s.eng ? s.eng.score : -1; });

  function themeName(id) { return tx(themeDefs[id], "name") || id; }
  function qText(q) { return tx(q.rqDef, "text"); }
  function periodLabel(p) { return V.monthLabel(p.key); }
  function periodTip(p) { return V.getLang() === "en" ? (p.tip || p.label) : V.monthLabel(p.key, true); }
  /* "New" only means something once there is an earlier run to compare against */
  function isNewSource(s) { if (!latest || !compareRun) return false; return s.run > compareRun.n; }
  function clusterStatus(c) { if (c.status) return c.status; if (!c.base && latest && c.firstSeenRun === latest.n) return "new"; return V.momentum(c.base, c.recent); }
  function answered(q) { return !!q.answer && (q.confidence || 0) > 0; }
  function eventIndex(ev) { var k = ev.date.slice(0, 7); for (var i = 0; i < periods.length; i++) if (periods[i].key === k) return i; return -1; }
  function events() { return (C.events || []).map(function (e) { return { i: eventIndex(e), label: tx(e, "label") + (e.approx ? T("approx_event") : "") }; }).filter(function (e) { return e.i >= 0; }); }

  /* ---------- Small builders (compose design-system pieces) ---------- */

      '<button class="btn sm icon-btn" type="button" data-table-toggle aria-label="' + esc(T("show_table")) + '" title="' + esc(T("show_table")) + '">' + V.icon("i-table", 14) + "</button></div></div>" +
      (opts.legendBelow || "") + '<div data-view="chart">' + opts.body + '</div><div data-view="table" hidden><div class="table-wrap"><table class="tbl compact chart-table" id="' + opts.tableId + '"></table></div></div></figure>';
  }
  function legendTrend() { return '<div class="legend"><span><i class="sw-pos"></i>' + T("above_zero") + '</span><span><i class="sw-neg"></i>' + T("below_zero") + '</span><span><i class="sw-vol"></i>' + T("posts") + "</span></div>"; }
  function legendSent() { return '<div class="legend"><span><i class="sw-pos"></i>' + V.SENT.pos + '</span><span><i class="sw-neu"></i>' + V.SENT.neu + '</span><span><i class="sw-neg"></i>' + V.SENT.neg + "</span></div>"; }
  function srcView(s) { return Object.assign({}, s, { where: T(s.where), id: "src-" + s.id, isNew: isNewSource(s), takeaway: tx(s, "takeaway"), themes: (s.themeIds || []).map(themeName) }); }
  function evidence(ids, limit) {
    var list = (ids || []).map(function (id) { return srcById[id]; }).filter(Boolean)
      .sort(function (a, b) { return (b.eng ? b.eng.raw : -1) - (a.eng ? a.eng.raw : -1); });
    if (!list.length) return '<p class="muted-text">' + T("no_linked") + "</p>";

  }
  function trendData() {
    return { labels: periods.map(periodLabel), tipLabels: periods.map(periodTip), net: periods.map(function (p) { return p.net; }), vol: periods.map(function (p) { return p.vol; }), events: events() };

      return { dir: diff === 0 ? "flat" : goodUp == null ? "flat" : (diff > 0) === goodUp ? "up" : "down", text: (diff === 0 ? T("no_change") : V.signed(diff) + (unit || "")) };

    var t1 = d(s.posts, p && p.posts, null), t2 = d(s.net, p && p.net, true, T("pts")), t3 = d(s.emerging, p && p.emerging, null), t4 = d(s.answered, p && p.answered, true);

      { label: T("t_net"), info: T("t_net_info"), value: V.signed(s.net || 0), delta: t2.text, dir: t2.dir, note: note, spark: periods.map(function (x) { return x.net; }) },
      { label: T("t_emerging"), info: T("t_emerging_info"), value: String(s.emerging || 0), delta: t3.text, dir: t3.dir, note: note, spark: series("emerging") },

      "</div>" +
      '<div class="split list-wide">' +
        '<div class="pane"><div class="section-head"><h3>' + T("p_sources") + '</h3><p id="src-count"></p></div><div class="table-wrap"><table class="tbl clickable" id="src-table"><thead><tr>' +
          '<th aria-sort="none"><button type="button" data-sort="site">' + T("source") + "</button></th><th>" + T("th_title_text") + '</th><th aria-sort="none"><button type="button" data-sort="sentiment">' + T("sentiment") + '</button></th><th aria-sort="none"><button type="button" data-sort="engScore">' + T("th_engagement") + '</button></th><th class="r" aria-sort="descending"><button type="button" data-sort="postedAt">' + T("th_posted") + "</button></th>" +
        "</tr></thead><tbody></tbody></table></div></div>" +
        '<div class="pane stack" id="sources-detail"></div>' +
      "</div>";
    var tableApi = V.sortableTable($("#src-table"), filteredSources(), function (s) {
      return '<tr data-id="' + esc(s.id) + '" class="' + (isNewSource(s) ? "is-new " : "") + (s.id === sel.sources ? "is-selected" : "") + '"><td><div class="row">' + V.platform(s.platform) + "<span>" + esc(s.site) + '</span></div></td><td><div class="clamp">' + esc(s.title || s.parentTitle || "") + (s.title || s.parentTitle ? " — " : "") + esc(s.content) + "</div></td><td>" + V.sentBadge(s.sentiment) + "</td><td>" + V.engScoreChip(s) + '</td><td class="r mono"' + (s.postedApprox ? ' title="' + esc(T("approx", { x: V.relLabel(s.postedApprox) })) + '"' : "") + ">" + V.fmtPosted(s) + "</td></tr>";
    }, { key: "postedAt", dir: -1 });
    function refresh() {
      var list = filteredSources();
      tableApi.setRows(list);
      $("#src-count").textContent = T("n_of_m", { a: list.length, b: sources.length });
      if (!list.length) $("#sources-detail").innerHTML = '<div class="empty">' + V.icon("i-inbox", 32) + "<h4>" + T("no_match") + "</h4><p>" + T("wider") + "</p></div>";
      else { if (!list.some(function (s) { return s.id === sel.sources; })) sel.sources = list[0].id; showSource(); }
    }
    function showSource() {
      var s = srcById[sel.sources];
      $$("#src-table tbody tr").forEach(function (tr) { tr.classList.toggle("is-selected", tr.dataset.id === sel.sources); });
      $("#sources-detail").innerHTML = s ? evidence([s.id]) : "";
      V.wireSourcePreviews($("#sources-detail"));
    }
    $("#src-table tbody").addEventListener("click", function (e) { var tr = e.target.closest("tr[data-id]"); if (tr) { sel.sources = tr.dataset.id; showSource(); } });
    $("#f-q").addEventListener("input", function (e) { filt.q = e.target.value; refresh(); });
    $("#f-theme").addEventListener("change", function (e) { filt.theme = e.target.value; refresh(); });
    $("#f-site").addEventListener("change", function (e) { filt.platform = e.target.value; refresh(); });
    $("#f-new").addEventListener("change", function (e) { filt.newOnly = e.target.checked; refresh(); });
    V.wireControls(el);
    el.addEventListener("chipchange", function (e) { var k = e.target.dataset.sent; filt.sents[k] = e.target.getAttribute("aria-pressed") === "true"; refresh(); });
    refresh();
  }

  function renderCompetitor() {
    var el = $("#page-competitor");
    var comp = D.competitor || {};
    var ids = sources.filter(function (s) { return s.competitor || (s.themeIds || []).indexOf("comparison") >= 0; }).map(function (s) { return s.id; });
    (comp.sourceIds || []).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    if (!comp.summary && !ids.length) { el.innerHTML = empty(T("no_mc"), T("no_mc_text")); return; }
    el.innerHTML = '<div class="card stack"><span class="eyebrow">' + T("comp_eyebrow") + "</span><p>" + esc(tx(comp, "summary") || "") + "</p></div>" +
      '<div class="block">' + sectionHead(T("mentions"), T("n_sources", { n: ids.length })) + '<div class="card-grid">' + evidence(ids) + "</div></div>";
  }

  function setupKv() {
    var w = C.windows;
    return '<dl class="kv"><dt>' + T("k_feature") + "</dt><dd>" + esc(tx(D.meta, "feature")) + "</dd><dt>" + T("k_competitor") + "</dt><dd>" + esc(tx(D.meta, "competitor")) + "</dd><dt>" + T("k_study") + '</dt><dd class="mono">' + V.fmtDate(w.study.from) + " → " + V.fmtDate(w.study.to) + "</dd><dt>" + T("k_recent") + '</dt><dd class="mono">' + V.fmtDate(w.recent.from) + " → " + V.fmtDate(w.recent.to) + "</dd><dt>" + T("k_baseline") + '</dt><dd class="mono">' + V.fmtDate(w.baseline.from) + " → " + V.fmtDate(w.baseline.to) + "</dd><dt>" + T("k_sources") + "</dt><dd>" + C.sources.map(function (s) { return esc(tx(s, "name")); }).join(", ") + "</dd><dt>" + T("k_keywords") + "</dt><dd>" + C.keywords.primary.map(esc).join(", ") + '<br><span class="muted-text">' + esc(V.getLang() === "ko" && C.ko ? C.ko.keywordsNote : C.keywords.note) + "</span></dd></dl>";
  }
  /* Method page: how the study is run, from VOC-Method.md */
  function renderMethod() {
    var lims = V.getLang() === "ko" && C.ko && C.ko.limitations ? C.ko.limitations : C.limitations;
    $("#page-method").innerHTML =
      '<div class="block">' + sectionHead(T("study_setup"), "") + '<div class="card">' + setupKv() + "</div></div>" +
      '<div class="block">' + sectionHead(T("sources_considered"), T("sc_sub", { n: (C.sourceList || []).length })) + '<div class="table-wrap"><table class="tbl compact"><thead><tr><th>' + T("th_platform") + "</th><th>" + T("source") + "</th><th>" + T("th_type") + "</th><th>" + T("th_scope") + "</th><th>" + T("status") + "</th></tr></thead><tbody>" +
        (C.sourceList || []).map(function (s) {
          var dom = s.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
          return "<tr><td>" + V.platform(s.platform) + "</td><td>" + V.xlink(s.url, s.name, dom) + "</td><td>" + esc(T(s.type)) + "</td><td>" + esc(T(s.scope)) + "</td><td>" + (s.status === "Active" ? '<span class="status good">' + V.icon("i-check", 14) + T("Active") + "</span>" : '<span class="status warning">' + V.icon("i-warn", 14) + esc(T(s.status)) + "</span>") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>" +
      '<div class="grid-2 equal"><div class="block">' + sectionHead(T("p_questions"), "") + '<div class="card"><ol class="list stack">' + C.researchQuestions.map(function (q) { return "<li>" + V.ilink("#/questions/" + q.id, q.num + " · " + tx(q, "text")) + "</li>"; }).join("") + "</ol></div></div>" +
      '<div class="block">' + sectionHead(T("limitations"), "") + '<div class="card"><ul class="list stack">' + lims.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul></div></div></div>" +
      '<div class="block">' + sectionHead(T("codebook"), T("n_themes", { n: C.themes.length })) + '<div class="table-wrap"><table class="tbl compact"><thead><tr><th>' + T("theme") + "</th><th>" + T("th_covers") + "</th><th>" + T("answers") + "</th></tr></thead><tbody>" + C.themes.map(function (t) {
        return "<tr><td>" + V.ilink("#/themes/" + t.id, tx(t, "name")) + "</td><td>" + esc(tx(t, "definition")) + "</td><td>" + (t.rq.length ? t.rq.map(function (id) { return id.toUpperCase(); }).join(", ") : T("secondary")) + "</td></tr>";
      }).join("") + "</tbody></table></div></div>" +
      '<div class="block">' + sectionHead(T("files"), "") + '<div class="card row">' + V.xlink("../VOC-Method.md", "VOC-Method.md", T("local_file")) + V.xlink("../Feature-Background.md", "Feature-Background.md", T("local_file")) + V.xlink("../AGENT-UPDATE-GUIDE.md", "AGENT-UPDATE-GUIDE.md", T("local_file")) + V.xlink("design-system.html", T("design_system"), T("local_file")) + "</div></div>";
  }

  function renderAgent() {
    $("#runs").innerHTML = runs.length ? runs.map(function (r, i) {
      var view = Object.assign({}, r, { links: (r.links || []).map(function (l) { return l; }) });
      return V.agentRun(view, i === 0);
    }).join("") : '<div class="empty">' + V.icon("i-agent", 32) + "<h4>" + T("no_runs_title") + "</h4><p>" + T("no_runs_text") + "</p></div>";
  }

  function renderBanners() {
    var b = [];
    if (D.meta.isSample) b.push('<div class="banner warning" role="status">' + V.icon("i-warn") + "<div>" + T("sample_banner") + "</div></div>");
    if (latest) {
      var days = Math.round((Date.now() - new Date(latest.date + "T00:00:00").getTime()) / 864e5);
      if (days > 14) b.push('<div class="banner warning" role="status">' + V.icon("i-warn") + "<div>" + T("stale_banner", { d: days, date: esc(V.fmtDate(latest.date)) }) + "</div></div>");
      var failed = (latest.sourcesChecked || []).filter(function (s) { return s.status !== "ok"; });
      if (failed.length) b.push('<div class="banner critical" role="alert">' + V.icon("i-warn") + "<div>" + T("failed_banner", { n: failed.length, what: failed.length === 1 ? T("one_source") : T("many_sources"), r: latest.n,
        list: failed.map(function (s) { return esc(tx(s, "name")) + (s.note ? " (" + esc(tx(s, "note")) + ")" : ""); }).join(", ") }) + "</div></div>");
    }
    $("#banners").innerHTML = b.join("");
  }

  function renderHeader() {
    $("#asof").innerHTML = latest ? '<span class="live"></span>' + esc(T("asof", { n: latest.n, date: V.fmtDate(latest.date), p: (latest.totalPosts || 0).toLocaleString("en-GB") })) : esc(T("no_runs_title"));
    var cmp = $("#compare");
    cmp.innerHTML = runs.length > 1 ? runs.slice(1).map(function (r) { return '<option value="' + r.n + '"' + (compareRun && r.n === compareRun.n ? " selected" : "") + ">" + esc(T("compare_opt", { n: r.n, date: V.fmtDate(r.date) })) + "</option>"; }).join("") : "<option>" + esc(T("no_earlier")) + "</option>";
    cmp.disabled = runs.length < 2;
  }

  /* Static labels in the page shell */
  function renderStatic() {
    $$("[data-i18n]").forEach(function (el) { el.textContent = T(el.getAttribute("data-i18n")); });
    $$("[data-i18n-title]").forEach(function (el) { var s = T(el.getAttribute("data-i18n-title")); el.title = s; el.setAttribute("aria-label", s); });
  }

  var RENDER = { overview: renderOverview, trend: renderTrend, themes: renderThemes, emerging: renderEmerging, questions: renderQuestions, sources: renderSources, competitor: renderCompetitor, method: renderMethod };
  function renderAll() { renderStatic(); renderHeader(); renderBanners(); renderAgent(); Object.keys(RENDER).forEach(function (k) { RENDER[k](); }); afterRender(document); }
  function afterRender(scope) { V.wireTableToggles(scope); V.wireSourcePreviews(scope); V.wireInfoTips(scope); }

  /* ---------- Router: #/page or #/page/item ---------- */
  function route(noScroll) {
    var parts = (location.hash || "#/overview").replace(/^#\/?/, "").split("/");
    var page = PAGES.indexOf(parts[0]) >= 0 ? parts[0] : "overview";
    var item = parts[1] ? decodeURIComponent(parts[1]) : null;
    if (item && sel.hasOwnProperty(page)) { sel[page] = item; RENDER[page](); afterRender($("#page-" + page)); }
    PAGES.forEach(function (id) { $("#page-" + id).hidden = id !== page; });
    $("#crumb").textContent = pageLabel(page); $("#page-title").textContent = pageLabel(page);
    document.title = pageLabel(page) + " · Nudge Sense";
    renderNav(page);
    if (noScroll === true) return;
    var target = item ? ($("#" + page + "-detail") || $("#page-" + page)) : (page === "trend" && parts[1] === "heatmap" ? $("#trend-heatmap") : null);
    if (target) { target.scrollIntoView({ behavior: "smooth", block: "start" }); V.flash(target); } else window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () { route(); });

  /* Split-view picks navigate through the router so links stay shareable */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-pick]");
    if (b) { location.hash = "#/" + b.dataset.pick + "/" + encodeURIComponent(b.dataset.id); return; }
    var a = e.target.closest("#agent a.ilink");
    if (a) $("#app").classList.remove("agent-open");
  });

  /* ---------- Compare & agent panel ---------- */
  $("#compare").addEventListener("change", function (e) { compareRun = runs.filter(function (r) { return String(r.n) === e.target.value; })[0] || null; renderAll(); route(); });
  var app = $("#app");
  function narrow() { return window.matchMedia("(max-width: 1200px)").matches; }
  function setCollapsed(v) { app.classList.toggle("agent-collapsed", v); try { localStorage.setItem("voc-agent-collapsed", v ? "1" : "0"); } catch (e) {} }
  try { if (localStorage.getItem("voc-agent-collapsed") === "1") app.classList.add("agent-collapsed"); } catch (e) {}
  $("#agent-toggle").addEventListener("click", function () { if (narrow()) app.classList.toggle("agent-open"); else setCollapsed(!app.classList.contains("agent-collapsed")); });
  $("#agent-close").addEventListener("click", function () { if (narrow()) app.classList.remove("agent-open"); else setCollapsed(true); });
  $("#scrim").addEventListener("click", function () { app.classList.remove("agent-open"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") app.classList.remove("agent-open"); });

  /* ---------- Language: re-render everything in place, keep the current page and scroll ---------- */
  V.onLangChange(function () { var y = window.scrollY; renderAll(); route(true); window.scrollTo(0, y); });

  V.initTheme();
  V.initLang();
  renderAll();
  route();
})();
</script>
</body>
</html>
