<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge Sense</title>
<!-- All styles come from the design system. Do not add styles here: extend voc-ds.css and document the variant in design-system.html. -->
<link rel="stylesheet" href="voc-ds.css">
</head>
<body>
<div class="app" id="app">
  <nav class="app-nav" aria-label="Dashboard pages">
    <div class="app-brand"><b>Nudge Sense</b><span>VoC · Samsung Now Nudge</span></div>
    <div class="nav-list" id="nav"></div>
    <div class="nav-foot">
      <span class="eyebrow">Theme</span>
      <div class="segmented full" role="group" aria-label="Theme">
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
      </div>
    </div>
  </nav>

  <main class="app-main" id="main">
    <header class="app-top">
      <div class="page-head">
        <div>
          <div class="crumbs"><span>Nudge Sense</span><span>/</span><span id="crumb"></span></div>
          <h2 id="page-title"></h2>
          <span class="asof" id="asof"></span>
        </div>
        <div class="row">
          <div class="field"><label for="compare">Compare with</label><select class="select" id="compare"></select></div>
          <button class="btn icon-btn" id="agent-toggle" type="button" aria-label="Show or hide agent updates" title="Agent updates"><svg width="16" height="16" aria-hidden="true"><use href="#i-panel"/></svg></button>
        </div>
      </div>
    </header>
    <div class="stack" id="banners"></div>
    <section class="page" id="page-overview" data-page="overview"></section>
    <section class="page" id="page-trend" data-page="trend" hidden></section>
    <section class="page" id="page-themes" data-page="themes" hidden></section>
    <section class="page" id="page-emerging" data-page="emerging" hidden></section>
    <section class="page" id="page-questions" data-page="questions" hidden></section>
    <section class="page" id="page-sources" data-page="sources" hidden></section>
    <section class="page" id="page-competitor" data-page="competitor" hidden></section>
    <section class="page" id="page-method" data-page="method" hidden></section>
  </main>

  <aside class="app-agent" id="agent" aria-label="Agent updates">
    <div class="agent-panel docked">
      <div class="agent-head">
        <h4><svg width="16" height="16" aria-hidden="true"><use href="#i-agent"/></svg>Agent updates</h4>
        <button class="btn ghost sm icon-btn" id="agent-close" type="button" aria-label="Hide agent updates" title="Hide agent updates"><svg width="14" height="14" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div class="agent-body" id="runs"></div>
    </div>
  </aside>
  <div class="app-scrim" id="scrim"></div>
</div>

<script src="voc-ds.js"></script>
<script src="voc-data.js"></script>
<script>
  if (/[?&]sample\b/.test(location.search)) document.write('<script src="voc-data.sample.js"><\/script>');
</script>
<script>
/* Dashboard logic: reads window.VOC_DATA and renders it with design-system components (window.VOC).
   No visual styling lives here. */
(function () {
  "use strict";
  var V = window.VOC, $ = V.$, $$ = V.$$, esc = V.esc;

  /* ---------- Data ---------- */
  var D = window.VOC_DATA;
  if (window.VOC_SAMPLE && /[?&]sample\b/.test(location.search)) {
    Object.keys(window.VOC_SAMPLE).forEach(function (k) { if (k !== "meta" && k !== "config") D[k] = window.VOC_SAMPLE[k]; });
    D.meta.isSample = true;
  }
  var C = D.config;
  var runs = (D.runs || []).slice().sort(function (a, b) { return b.n - a.n; });
  var latest = runs[0] || null;
  var compareRun = runs[1] || null;
  var periods = (D.trend && D.trend.periods) || [];
  var themeDefs = {}; C.themes.forEach(function (t) { themeDefs[t.id] = t; });
  var themes = (D.themes || []).map(function (t) { var d = themeDefs[t.id] || {}; return Object.assign({ name: d.name || t.id, definition: d.definition || "", rq: d.rq || [] }, t); })
    .sort(function (a, b) { return b.vol - a.vol; });
  var themeById = {}; themes.forEach(function (t) { themeById[t.id] = t; });
  var clusters = (D.clusters || []).slice().sort(function (a, b) { return (b.recent - b.base) - (a.recent - a.base); });
  var qById = {}; (D.questions || []).forEach(function (q) { qById[q.id] = q; });
  var questions = C.researchQuestions.map(function (rq) { return Object.assign({}, rq, qById[rq.id] || {}); });
  var sources = (D.sources || []).slice().sort(function (a, b) { return a.postedAt < b.postedAt ? 1 : -1; });
  var srcById = {}; sources.forEach(function (s) { srcById[s.id] = s; });
  V.scoreEngagement(sources);
  sources.forEach(function (s) { s.engScore = s.eng ? s.eng.score : -1; });

  function themeName(id) { return (themeDefs[id] && themeDefs[id].name) || id; }
  /* "New" only means something once there is an earlier run to compare against */
  function isNewSource(s) { if (!latest || !compareRun) return false; return s.run > compareRun.n; }
  function clusterStatus(c) { if (c.status) return c.status; if (!c.base && latest && c.firstSeenRun === latest.n) return "new"; return V.momentum(c.base, c.recent); }
  function answered(q) { return !!q.answer && (q.confidence || 0) > 0; }
  function eventIndex(ev) { var k = ev.date.slice(0, 7); for (var i = 0; i < periods.length; i++) if (periods[i].key === k) return i; return -1; }
  var events = (C.events || []).map(function (e) { return { i: eventIndex(e), label: e.label + (e.approx ? " (approx.)" : "") }; }).filter(function (e) { return e.i >= 0; });

  /* ---------- Small builders (compose design-system pieces) ---------- */
  function sectionHead(title, sub) { return '<div class="section-head"><h3>' + esc(title) + "</h3>" + (sub ? "<p>" + esc(sub) + "</p>" : "") + "</div>"; }
  function empty(title, text) { return '<div class="card empty">' + V.icon("i-inbox", 32) + "<h4>" + esc(title) + "</h4><p>" + esc(text) + "</p></div>"; }
  function figure(opts) {
    return '<figure class="chart card" data-chart-wrap><div class="chart-head"><div><h4>' + esc(opts.title) + (opts.info ? V.infoTip(opts.info, opts.title) : "") + "</h4>" + (opts.sub ? "<p>" + esc(opts.sub) + "</p>" : "") + '</div><div class="row">' + (opts.legend || "") +
      '<button class="btn sm icon-btn" type="button" data-table-toggle aria-label="Show as table" title="Show as table">' + V.icon("i-table", 14) + "</button></div></div>" +
      (opts.legendBelow || "") + '<div data-view="chart">' + opts.body + '</div><div data-view="table" hidden><div class="table-wrap"><table class="tbl compact chart-table" id="' + opts.tableId + '"></table></div></div></figure>';
  }
  var LEGEND_TREND = '<div class="legend"><span><i class="sw-pos"></i>Above zero</span><span><i class="sw-neg"></i>Below zero</span><span><i class="sw-vol"></i>Posts</span></div>';
  var LEGEND_SENT = '<div class="legend"><span><i class="sw-pos"></i>Positive</span><span><i class="sw-neu"></i>Neutral</span><span><i class="sw-neg"></i>Negative</span></div>';
  function evidence(ids, limit) {
    var list = (ids || []).map(function (id) { return srcById[id]; }).filter(Boolean)
      .sort(function (a, b) { return (b.eng ? b.eng.raw : -1) - (a.eng ? a.eng.raw : -1); });
    if (!list.length) return '<p class="muted-text">No sources linked yet.</p>';
    return list.slice(0, limit || 50).map(function (s) {
      return V.sourcePreview(Object.assign({}, s, { id: "src-" + s.id, isNew: isNewSource(s), themes: (s.themeIds || []).map(themeName) }));
    }).join("");
  }
  function trendData() {
    return { labels: periods.map(function (p) { return p.label; }), tipLabels: periods.map(function (p) { return p.tip || p.label; }), net: periods.map(function (p) { return p.net; }), vol: periods.map(function (p) { return p.vol; }), events: events };
  }
  function pct(n) { return n + "%"; }

  /* ---------- Pages ---------- */
  var PAGES = [
    { id: "overview", label: "Overview" },
    { id: "trend", label: "Sentiment trend" },
    { id: "themes", label: "Themes" },
    { id: "emerging", label: "Emerging clusters" },
    { id: "questions", label: "Research questions" },
    { id: "sources", label: "Sources" },
    { id: "competitor", label: "Magic Cue mentions" },
    { id: "method", label: "Method" }
  ];
  var sel = { themes: themes[0] && themes[0].id, emerging: clusters[0] && clusters[0].id, questions: "q1", sources: sources[0] && sources[0].id };
  var NO_RUNS = "No runs yet. Ask the agent to run the VoC check using AGENT-UPDATE-GUIDE.md.";

  function renderNav(active) {
    var newSrc = sources.some(isNewSource);
    var newClusters = clusters.some(function (c) { return clusterStatus(c) === "new"; });
    $("#nav").innerHTML = PAGES.map(function (p) {
      var extra = "";
      if (p.id === "themes" && themes.length) extra = '<span class="count">' + themes.length + "</span>";
      if (p.id === "questions" && latest) extra = '<span class="count">' + questions.filter(answered).length + "/" + questions.length + "</span>";
      if (p.id === "sources" && sources.length) extra = newSrc ? '<span class="dot-new" title="New since compared run"></span>' : '<span class="count">' + sources.length + "</span>";
      if (p.id === "emerging" && newClusters) extra = '<span class="dot-new" title="New since compared run"></span>';
      return '<a class="nav-item' + (p.id === active ? " is-active" : "") + '" href="#/' + p.id + '"' + (p.id === active ? ' aria-current="page"' : "") + ">" + esc(p.label) + extra + "</a>";
    }).join("");
  }

  function renderOverview() {
    var el = $("#page-overview");
    if (!latest) {
      el.innerHTML = empty("No results yet", NO_RUNS);
      return;
    }
    var s = latest.snapshot || {}, p = (compareRun && compareRun.snapshot) || null;
    var note = compareRun ? "vs Run " + compareRun.n : "";
    function d(cur, prev, goodUp, unit) {
      if (prev == null) return { dir: "flat", text: "First run" };
      var diff = cur - prev;
      return { dir: diff === 0 ? "flat" : goodUp == null ? "flat" : (diff > 0) === goodUp ? "up" : "down", text: (diff === 0 ? "No change" : V.signed(diff) + (unit || "")) };
    }
    var series = function (k) { return runs.slice().reverse().map(function (r) { return (r.snapshot || {})[k] || 0; }); };
    var t1 = d(s.posts, p && p.posts, null), t2 = d(s.net, p && p.net, true, " pts"), t3 = d(s.emerging, p && p.emerging, null), t4 = d(s.answered, p && p.answered, true);
    var tiles = [
      { label: "Posts analysed", info: "Public posts about Now Nudge collected and coded since " + V.fmtDate(C.windows.study.from) + ". The change is the number of posts added since the compared run.", value: (s.posts || 0).toLocaleString("en-GB"), delta: t1.text, dir: t1.dir, note: note, spark: series("posts") },
      { label: "Net sentiment", info: "Share of positive posts minus share of negative posts, across all posts. Ranges from −100 to +100. The mini chart shows it month by month.", value: V.signed(s.net || 0), delta: t2.text, dir: t2.dir, note: note, spark: periods.map(function (x) { return x.net; }) },
      { label: "Emerging clusters", info: "Recurring topics (3 or more posts) that are new or growing: their share of conversation in the last 60 days is at least 25% higher than in the baseline window.", value: String(s.emerging || 0), delta: t3.text, dir: t3.dir, note: note, spark: series("emerging") },
      { label: "Questions answered", info: "Research questions with enough evidence to answer (3 or more relevant posts), out of the 6 in the method.", value: (s.answered || 0) + " / " + questions.length, delta: t4.text, dir: t4.dir, note: note, spark: series("answered") }
    ];
    var insights = (D.insights || []).slice(0, 3);
    el.innerHTML =
      '<div class="tiles">' + tiles.map(V.statTile).join("") + "</div>" +
      (insights.length ? '<div class="block">' + sectionHead("Top insights", "Written by the agent from the evidence") + '<div class="card-grid equal">' + insights.map(function (i, n) {
        return V.insightCard(Object.assign({}, i, { meta: (i.posts || 0) + " posts · " + (i.themeIds || []).length + " themes" }), n + 1, { href: "#/themes/" + ((i.themeIds || [])[0] || ""), linkText: "See " + (i.sourceIds || []).length + " sources" });
      }).join("") + "</div></div>" : "") +
      '<div class="stack">' +
        figure({ title: "Net sentiment over time", info: "Net sentiment = % positive posts − % negative posts, per month. Dots are blue above zero and red below. Bars show how many posts were collected that month. Flags mark key events.", sub: "% positive minus % negative", legend: LEGEND_TREND, body: '<svg id="ov-trend" viewBox="0 0 680 300" role="img" aria-label="Net sentiment and posts over time"></svg>', tableId: "ov-trend-table" }) +
        figure({ title: "Themes by volume", info: "Bar length = number of posts tagged with the theme. Colours show the share of positive, neutral and negative posts. Click a bar to open the theme.", sub: "Top 6 · bar = sentiment split", legendBelow: LEGEND_SENT, body: '<div class="hbar" id="ov-hbar"></div>', tableId: "ov-hbar-table" }) +
      "</div>" +
      '<div class="block">' + sectionHead("What changed in Run " + latest.n, compareRun ? "Compared with Run " + compareRun.n : "First run") + '<div class="card">' + V.changeGroups(latest.changes) + "</div></div>";
    if (periods.length) V.trendChart($("#ov-trend"), trendData(), $("#ov-trend-table"));
    V.hbarChart($("#ov-hbar"), themes.slice(0, 6).map(function (t) { return Object.assign({ href: "#/themes/" + t.id }, t); }), $("#ov-hbar-table"));
  }

  function renderTrend() {
    var el = $("#page-trend");
    if (!periods.length) { el.innerHTML = empty("No trend yet", NO_RUNS); return; }
    var last = periods[periods.length - 1];
    el.innerHTML =
      figure({ title: "Net sentiment over time", info: "Net sentiment = % positive posts − % negative posts, per month. Dots are blue above zero and red below. Bars show how many posts were collected that month. Flags mark key events.", sub: "% positive minus % negative · per " + (D.trend.grain || "period") + " · flags mark key events", legend: LEGEND_TREND, body: '<svg id="tr-trend" viewBox="0 0 680 300" role="img" aria-label="Net sentiment and posts over time"></svg>', tableId: "tr-trend-table" }) +
      '<div class="block" id="trend-period"></div>' +
      '<div id="trend-heatmap">' + figure({ title: "Net sentiment by theme", info: "Each cell is a theme's net sentiment in one month. Blue = more positive, red = more negative, grey = balanced. Empty cells had fewer than 3 posts.", sub: "Which parts of the feature are getting better or worse", legend: '<div class="scale-legend" id="tr-hm-legend"></div>', body: '<div class="heatmap" id="tr-hm"></div>', tableId: "tr-hm-table" }) + "</div>";
    V.trendChart($("#tr-trend"), trendData(), $("#tr-trend-table"));
    V.scaleLegend($("#tr-hm-legend"));
    V.heatmap($("#tr-hm"), themes.map(function (t) { return { name: t.name, values: t.byPeriod || [] }; }), periods.map(function (p) { return p.label; }), $("#tr-hm-table"));
    renderPeriod();
  }

  /* Sentiment split for one period, with the captured sources behind each part */
  var periodIdx = null;
  function renderPeriod() {
    var box = $("#trend-period"); if (!box) return;
    if (periodIdx == null || periodIdx >= periods.length) periodIdx = periods.length - 1;
    var p = periods[periodIdx];
    var inP = sources.filter(function (s) { return (s.postedAt || "").slice(0, 7) === p.key; });
    var cols = [
      { key: "pos", title: "Positive", list: inP.filter(function (s) { return s.sentiment === "pos"; }) },
      { key: "neu", title: "Neutral & mixed", list: inP.filter(function (s) { return s.sentiment === "neu" || s.sentiment === "mix"; }) },
      { key: "neg", title: "Negative", list: inP.filter(function (s) { return s.sentiment === "neg"; }) }
    ];
    box.innerHTML =
      '<div class="section-head"><h3>Sentiment split · ' + esc(p.tip || p.label) + '</h3><div class="field"><label for="tr-period">Period</label><select class="select" id="tr-period">' +
        periods.map(function (x, i) { return '<option value="' + i + '"' + (i === periodIdx ? " selected" : "") + ">" + esc(x.tip || x.label) + "</option>"; }).slice().reverse().join("") + "</select></div></div>" +
      '<div class="card stack">' + V.splitBar(p.pos, p.neu, p.neg) +
        '<span class="muted-text">' + p.pos + "% positive · " + p.neu + "% neutral · " + p.neg + "% negative · " + p.vol + " posts</span>" +
        '<div class="grid-3 equal">' + cols.map(function (c) {
          return '<div class="block"><div class="section-head"><h3>' + V.sentBadge(c.key === "neu" ? "neu" : c.key).replace("Neutral", c.title) + "</h3><p>" + c.list.length + " captured</p></div><div>" +
            (c.list.length ? c.list.map(function (s) { return V.sourceRow(Object.assign({ href: "#/sources/" + s.id }, s)); }).join("") : '<p class="muted-text">No captured sources.</p>') + "</div></div>";
        }).join("") + "</div>" +
        '<p class="muted-text">Captured sources posted in ' + esc(p.tip || p.label) + " (" + inP.length + " of " + p.vol + " posts). Click a post to see it in full in Sources.</p>" +
      "</div>";
    $("#tr-period").addEventListener("change", function (e) { periodIdx = +e.target.value; renderPeriod(); });
  }

  function renderThemes() {
    var el = $("#page-themes");
    if (!themes.length) { el.innerHTML = empty("No themes yet", NO_RUNS); return; }
    var t = themeById[sel.themes] || themes[0];
    var m = V.momentum(t.base, t.recent);
    var rqs = (t.rq || []).map(function (id) { var q = questions.filter(function (x) { return x.id === id; })[0]; return q ? "<li>" + V.ilink("#/questions/" + q.id, q.num + " · " + q.text) + "</li>" : ""; }).join("");
    el.innerHTML = '<div class="split">' +
      '<div class="pane scroll">' + sectionHead("Themes", "By volume") + '<div role="listbox" aria-label="Themes">' + themes.map(function (x) {
        return '<button class="pick" role="option" data-pick="themes" data-id="' + esc(x.id) + '" aria-selected="' + (x.id === t.id) + '"><span class="nm">' + esc(x.name) + "</span>" + V.splitBar(x.pos, x.neu, x.neg) + '<span class="num muted-text">' + x.vol + "</span></button>";
      }).join("") + "</div></div>" +
      '<div class="pane stack" id="themes-detail">' +
        '<div class="row between"><h3>' + esc(t.name) + "</h3>" + V.momBadge(m) + "</div>" +
        '<p class="muted-text">' + esc(t.definition) + "</p>" +
        '<dl class="kv"><dt>Posts</dt><dd class="num">' + t.vol + "</dd><dt>Share, recent window</dt><dd class=\"num\">" + pct(t.recent) + " (baseline " + pct(t.base) + ")</dd><dt>Sentiment</dt><dd>" + t.pos + "% positive · " + t.neu + "% neutral · " + t.neg + "% negative</dd><dt>Net sentiment trend</dt><dd>" + V.sparkline((t.byPeriod || []).filter(function (v) { return v != null; })) + "</dd></dl>" +
        (t.summary ? '<div class="takeaway"><span class="eyebrow">Agent summary</span><p>' + esc(t.summary) + "</p></div>" : "") +
        (rqs ? '<div class="stack tight"><span class="eyebrow">Answers</span><ul class="list stack tight">' + rqs + "</ul></div>" : "") +
        sectionHead("Evidence", (t.sourceIds || []).length + " sources") + '<div class="stack">' + evidence(t.sourceIds) + "</div>" +
      "</div></div>";
  }

  function renderEmerging() {
    var el = $("#page-emerging");
    if (!clusters.length) { el.innerHTML = empty("No clusters yet", NO_RUNS); return; }
    var c = clusters.filter(function (x) { return x.id === sel.emerging; })[0] || clusters[0];
    var w = C.windows;
    el.innerHTML =
      figure({ title: "Share of conversation", info: "Share of conversation = posts in the cluster ÷ all posts in that window. Left: baseline window. Right: last 60 days. Amber lines are new or rising (up 25% or more).", sub: "Baseline (" + V.fmtDate(w.baseline.from) + " – " + V.fmtDate(w.baseline.to) + ") → recent (" + V.fmtDate(w.recent.from) + " – " + V.fmtDate(w.recent.to) + ")", body: '<svg id="em-slope" viewBox="0 0 440 280" role="img" aria-label="Cluster share, baseline versus recent"></svg>', tableId: "em-slope-table" }) +
      '<div class="split">' +
        '<div class="pane">' + sectionHead("Clusters", "Biggest change first") + '<div role="listbox" aria-label="Clusters">' + clusters.map(function (x) {
          return '<button class="pick" role="option" data-pick="emerging" data-id="' + esc(x.id) + '" aria-selected="' + (x.id === c.id) + '"><span class="nm">' + esc(x.name) + "</span>" + V.momBadge(clusterStatus(x)) + '<span class="num muted-text">' + pct(x.recent) + "</span></button>";
        }).join("") + "</div></div>" +
        '<div class="pane stack" id="emerging-detail">' +
          '<div class="row between"><h3>' + esc(c.name) + "</h3>" + V.momBadge(clusterStatus(c)) + "</div>" +
          '<dl class="kv"><dt>Baseline share</dt><dd class="num">' + pct(c.base) + "</dd><dt>Recent share</dt><dd class=\"num\">" + pct(c.recent) + "</dd><dt>Theme</dt><dd>" + V.ilink("#/themes/" + c.themeId, themeName(c.themeId)) + "</dd><dt>First seen</dt><dd>Run " + esc(c.firstSeenRun) + "</dd></dl>" +
          (c.summary ? '<div class="takeaway"><span class="eyebrow">Agent summary</span><p>' + esc(c.summary) + "</p></div>" : "") +
          sectionHead("Evidence", (c.sourceIds || []).length + " sources") + '<div class="stack">' + evidence(c.sourceIds) + "</div>" +
        "</div></div>";
    V.slopeChart($("#em-slope"), clusters.map(function (x) { return { name: x.name, short: x.name.length > 18 ? x.name.slice(0, 17) + "…" : x.name, base: x.base, recent: x.recent }; }), $("#em-slope-table"), ["Baseline", "Recent"]);
  }

  function renderQuestions() {
    var el = $("#page-questions");
    var q = questions.filter(function (x) { return x.id === sel.questions; })[0] || questions[0];
    var hist = (q.history || []).map(function (h) { var r = runs.filter(function (x) { return x.id === h.runId; })[0]; return { label: (r ? "Run " + r.n + " · " : "") + V.fmtDate(h.date), short: h.short, text: h.text }; });
    el.innerHTML = '<div class="split">' +
      '<div class="pane">' + sectionHead("Research questions", questions.filter(answered).length + " of " + questions.length + " answered") + '<div role="listbox" aria-label="Research questions">' + questions.map(function (x) {
        return '<button class="pick stacked" role="option" data-pick="questions" data-id="' + esc(x.id) + '" aria-selected="' + (x.id === q.id) + '"><span class="nm"><span class="qn">' + esc(x.num) + "</span> " + esc(x.text) + "</span>" + V.confidence(x.confidence || 0, "") + '<span class="sub">' + esc(x.short || "Not answered yet") + "</span></button>";
      }).join("") + "</div></div>" +
      '<div class="pane stack" id="questions-detail">' +
        V.rqCard({ num: q.num, text: q.text, short: q.short, answer: q.answer, confidence: q.confidence, posts: q.posts, change: q.change, tags: (q.themeIds || []).map(themeName) }) +
        (hist.length ? '<div class="stack tight"><span class="eyebrow">How the answer changed</span>' + V.timeline(hist) + "</div>" : "") +
        sectionHead("Evidence", (q.sourceIds || []).length + " sources") + '<div class="stack">' + evidence(q.sourceIds) + "</div>" +
      "</div></div>";
  }

  var filt = { q: "", theme: "", platform: "", sents: { pos: true, neu: true, neg: true, mix: true }, newOnly: false };
  function filteredSources() {
    var q = filt.q.toLowerCase();
    return sources.filter(function (s) {
      if (filt.theme && (s.themeIds || []).indexOf(filt.theme) < 0) return false;
      if (filt.platform && s.site !== filt.platform) return false;
      if (!filt.sents[s.sentiment]) return false;
      if (filt.newOnly && !isNewSource(s)) return false;
      if (q && ((s.title || "") + " " + (s.content || "") + " " + (s.takeaway || "") + " " + (s.parentTitle || "")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function renderSources() {
    var el = $("#page-sources");
    if (!sources.length) { el.innerHTML = empty("No sources yet", NO_RUNS); return; }
    var sites = []; sources.forEach(function (s) { if (sites.indexOf(s.site) < 0) sites.push(s.site); });
    var plat = V.platformEngagement(sources);
    el.innerHTML =
      '<div class="block"><div class="section-head"><h3>Engagement by platform' + V.infoTip("Interactions = reactions (upvotes, likes) + 2 × comments/replies + 3 × reposts/shares − downvotes, using the counts shown when each post was captured. Views are shown on posts but not counted. Each post's score (0–100) compares it only with posts from the same platform.", "Engagement by platform") + "</h3><p>Captured sources only</p></div>" +
        '<div class="table-wrap"><table class="tbl compact"><thead><tr><th>Platform</th><th class="r">Posts</th><th class="r">With counts</th><th class="r">Interactions</th><th class="r">Median per post</th><th>Share of interactions</th></tr></thead><tbody>' +
        plat.map(function (p) { return '<tr><td><div class="row">' + V.platform(p.platform) + "<span>" + esc(p.site) + '</span></div></td><td class="r num">' + p.posts + '</td><td class="r num">' + p.withCounts + '</td><td class="r num">' + V.fmtNum(p.interactions) + '</td><td class="r num">' + V.fmtNum(p.median) + '</td><td><div class="share-meter"><div class="bar"><i style="width:' + p.share + '%"></i></div><span class="num">' + p.share + "%</span></div></td></tr>"; }).join("") +
        "</tbody></table></div></div>" +
      '<div class="filter-bar">' +
        '<div class="search">' + V.icon("i-search") + '<input class="input" id="f-q" type="search" placeholder="Search title, text or takeaway" aria-label="Search sources" value="' + esc(filt.q) + '"></div>' +
        '<select class="select" id="f-theme" aria-label="Theme"><option value="">All themes</option>' + C.themes.map(function (t) { return '<option value="' + t.id + '"' + (filt.theme === t.id ? " selected" : "") + ">" + esc(t.name) + "</option>"; }).join("") + "</select>" +
        '<select class="select" id="f-site" aria-label="Source"><option value="">All sources</option>' + sites.map(function (s) { return '<option' + (filt.platform === s ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("") + "</select>" +
        ["neg", "neu", "pos", "mix"].map(function (k) { return '<span class="chip" role="button" tabindex="0" data-chip data-sent="' + k + '" aria-pressed="' + filt.sents[k] + '">' + V.SENT[k] + "</span>"; }).join("") +
        '<span class="spacer"></span><label class="toggle"><input type="checkbox" id="f-new"' + (filt.newOnly ? " checked" : "") + "> New only</label>" +
      "</div>" +
      '<div class="split list-wide">' +
        '<div class="pane"><div class="section-head"><h3>Sources</h3><p id="src-count"></p></div><div class="table-wrap"><table class="tbl clickable" id="src-table"><thead><tr>' +
          '<th aria-sort="none"><button type="button" data-sort="site">Source</button></th><th>Title / text</th><th aria-sort="none"><button type="button" data-sort="sentiment">Sentiment</button></th><th aria-sort="none"><button type="button" data-sort="engScore">Engagement</button></th><th class="r" aria-sort="descending"><button type="button" data-sort="postedAt">Posted</button></th>' +
        "</tr></thead><tbody></tbody></table></div></div>" +
        '<div class="pane stack" id="sources-detail"></div>' +
      "</div>";
    var tableApi = V.sortableTable($("#src-table"), filteredSources(), function (s) {
      return '<tr data-id="' + esc(s.id) + '" class="' + (isNewSource(s) ? "is-new " : "") + (s.id === sel.sources ? "is-selected" : "") + '"><td><div class="row">' + V.platform(s.platform) + "<span>" + esc(s.site) + '</span></div></td><td><div class="clamp">' + esc(s.title || s.parentTitle || "") + (s.title || s.parentTitle ? " — " : "") + esc(s.content) + "</div></td><td>" + V.sentBadge(s.sentiment) + "</td><td>" + V.engScoreChip(s) + '</td><td class="r mono"' + (s.postedApprox ? ' title="Approximate (' + esc(s.postedApprox) + ')"' : "") + '>' + V.fmtPosted(s) + "</td></tr>";
    }, { key: "postedAt", dir: -1 });
    function refresh() {
      var list = filteredSources();
      tableApi.setRows(list);
      $("#src-count").textContent = list.length + " of " + sources.length;
      if (!list.length) $("#sources-detail").innerHTML = '<div class="empty">' + V.icon("i-inbox", 32) + "<h4>No sources match these filters</h4><p>Try a wider filter.</p></div>";
      else { if (!list.some(function (s) { return s.id === sel.sources; })) sel.sources = list[0].id; showSource(); }
    }
    function showSource() {
      var s = srcById[sel.sources];
      $$("#src-table tbody tr").forEach(function (tr) { tr.classList.toggle("is-selected", tr.dataset.id === sel.sources); });
      $("#sources-detail").innerHTML = s ? evidence([s.id]) : "";
      V.wireSourcePreviews($("#sources-detail"));
    }
    $("#src-table tbody").addEventListener("click", function (e) { var tr = e.target.closest("tr[data-id]"); if (tr) { sel.sources = tr.dataset.id; showSource(); } });
    $("#f-q").addEventListener("input", function (e) { filt.q = e.target.value; refresh(); });
    $("#f-theme").addEventListener("change", function (e) { filt.theme = e.target.value; refresh(); });
    $("#f-site").addEventListener("change", function (e) { filt.platform = e.target.value; refresh(); });
    $("#f-new").addEventListener("change", function (e) { filt.newOnly = e.target.checked; refresh(); });
    V.wireControls(el);
    el.addEventListener("chipchange", function (e) { var k = e.target.dataset.sent; filt.sents[k] = e.target.getAttribute("aria-pressed") === "true"; refresh(); });
    refresh();
  }

  function renderCompetitor() {
    var el = $("#page-competitor");
    var comp = D.competitor || {};
    var ids = sources.filter(function (s) { return s.competitor || (s.themeIds || []).indexOf("comparison") >= 0; }).map(function (s) { return s.id; });
    (comp.sourceIds || []).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    if (!comp.summary && !ids.length) { el.innerHTML = empty("No Magic Cue mentions yet", "Magic Cue is tracked only when it comes up in Now Nudge conversations."); return; }
    el.innerHTML = '<div class="card stack"><span class="eyebrow">Agent summary · secondary to the study</span><p>' + esc(comp.summary || "") + "</p></div>" +
      '<div class="block">' + sectionHead("Mentions", ids.length + " sources") + '<div class="card-grid">' + evidence(ids) + "</div></div>";
  }

  function setupKv() {
    var w = C.windows;
    return '<dl class="kv"><dt>Feature</dt><dd>' + esc(D.meta.feature) + "</dd><dt>Competitor</dt><dd>" + esc(D.meta.competitor) + '</dd><dt>Study window</dt><dd class="mono">' + V.fmtDate(w.study.from) + " → " + V.fmtDate(w.study.to) + '</dd><dt>Recent window</dt><dd class="mono">' + V.fmtDate(w.recent.from) + " → " + V.fmtDate(w.recent.to) + '</dd><dt>Baseline window</dt><dd class="mono">' + V.fmtDate(w.baseline.from) + " → " + V.fmtDate(w.baseline.to) + "</dd><dt>Sources</dt><dd>" + C.sources.map(function (s) { return esc(s.name); }).join(", ") + "</dd><dt>Keywords</dt><dd>" + C.keywords.primary.map(esc).join(", ") + '<br><span class="muted-text">' + esc(C.keywords.note) + "</span></dd></dl>";
  }
  /* Method page: how the study is run, from VOC-Method.md */
  function renderMethod() {
    $("#page-method").innerHTML =
      '<div class="block">' + sectionHead("Study setup", "") + '<div class="card">' + setupKv() + "</div></div>" +
      '<div class="block">' + sectionHead("Sources considered", (C.sourceList || []).length + " sources · from VOC-Method.md") + '<div class="table-wrap"><table class="tbl compact"><thead><tr><th>Platform</th><th>Source</th><th>Type</th><th>Scope</th><th>Status</th></tr></thead><tbody>' +
        (C.sourceList || []).map(function (s) {
          var dom = s.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
          return '<tr><td>' + V.platform(s.platform) + "</td><td>" + V.xlink(s.url, s.name, dom) + "</td><td>" + esc(s.type) + "</td><td>" + esc(s.scope) + "</td><td>" + (s.status === "Active" ? '<span class="status good">' + V.icon("i-check", 14) + "Active</span>" : '<span class="status warning">' + V.icon("i-warn", 14) + esc(s.status) + "</span>") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>" +
      '<div class="grid-2 equal"><div class="block">' + sectionHead("Research questions", "") + '<div class="card"><ol class="list stack">' + C.researchQuestions.map(function (q) { return "<li>" + V.ilink("#/questions/" + q.id, q.num + " · " + q.text) + "</li>"; }).join("") + "</ol></div></div>" +
      '<div class="block">' + sectionHead("Limitations", "") + '<div class="card"><ul class="list stack">' + C.limitations.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul></div></div></div>" +
      '<div class="block">' + sectionHead("Theme codebook", C.themes.length + " themes") + '<div class="table-wrap"><table class="tbl compact"><thead><tr><th>Theme</th><th>What it covers</th><th>Answers</th></tr></thead><tbody>' + C.themes.map(function (t) {
        return "<tr><td>" + V.ilink("#/themes/" + t.id, t.name) + "</td><td>" + esc(t.definition) + "</td><td>" + (t.rq.length ? t.rq.map(function (id) { return id.toUpperCase(); }).join(", ") : "Secondary") + "</td></tr>";
      }).join("") + "</tbody></table></div></div>" +
      '<div class="block">' + sectionHead("Files", "") + '<div class="card row">' + V.xlink("../VOC-Method.md", "VOC-Method.md", "local file") + V.xlink("../Feature-Background.md", "Feature-Background.md", "local file") + V.xlink("../AGENT-UPDATE-GUIDE.md", "AGENT-UPDATE-GUIDE.md", "local file") + V.xlink("design-system.html", "Design system", "local file") + "</div></div>";
  }

  function renderAgent() {
    $("#runs").innerHTML = runs.length ? runs.map(function (r, i) { return V.agentRun(r, i === 0); }).join("") : '<div class="empty">' + V.icon("i-agent", 32) + "<h4>No runs yet</h4><p>Each time the agent runs a VoC check, its summary and links appear here.</p></div>";
  }

  function renderBanners() {
    var b = [];
    if (D.meta.isSample) b.push('<div class="banner warning" role="status">' + V.icon("i-warn") + "<div><b>Sample data, not study data.</b> Open index.html without <span class=\"mono\">?sample</span> to see the real study.</div></div>");
    if (latest) {
      var days = Math.round((Date.now() - new Date(latest.date + "T00:00:00").getTime()) / 864e5);
      if (days > 14) b.push('<div class="banner warning" role="status">' + V.icon("i-warn") + "<div><b>Data is " + days + " days old.</b> The last run was on " + V.fmtDate(latest.date) + ". Ask the agent to run a new VoC check.</div></div>");
      var failed = (latest.sourcesChecked || []).filter(function (s) { return s.status !== "ok"; });
      if (failed.length) b.push('<div class="banner critical" role="alert">' + V.icon("i-warn") + "<div><b>" + failed.length + (failed.length === 1 ? " source" : " sources") + " could not be checked in Run " + latest.n + ".</b> Numbers for this run leave them out: " +
        failed.map(function (s) { return esc(s.name) + (s.note ? " (" + esc(s.note) + ")" : ""); }).join(", ") + ".</div></div>");
    }
    $("#banners").innerHTML = b.join("");
  }

  function renderHeader() {
    $("#asof").innerHTML = latest ? '<span class="live"></span>As of Run ' + latest.n + " · " + V.fmtDate(latest.date) + " · " + (latest.totalPosts || 0).toLocaleString("en-GB") + " posts" : "No runs yet";
    var cmp = $("#compare");
    cmp.innerHTML = runs.length > 1 ? runs.slice(1).map(function (r) { return '<option value="' + r.n + '"' + (compareRun && r.n === compareRun.n ? " selected" : "") + ">Run " + r.n + " · " + V.fmtDate(r.date) + "</option>"; }).join("") : "<option>No earlier run</option>";
    cmp.disabled = runs.length < 2;
  }

  var RENDER = { overview: renderOverview, trend: renderTrend, themes: renderThemes, emerging: renderEmerging, questions: renderQuestions, sources: renderSources, competitor: renderCompetitor, method: renderMethod };
  function renderAll() { renderHeader(); renderBanners(); renderAgent(); Object.keys(RENDER).forEach(function (k) { RENDER[k](); }); afterRender(document); }
  function afterRender(scope) { V.wireTableToggles(scope); V.wireSourcePreviews(scope); V.wireInfoTips(scope); }

  /* ---------- Router: #/page or #/page/item ---------- */
  var current = "overview";
  function route() {
    var parts = (location.hash || "#/overview").replace(/^#\/?/, "").split("/");
    var page = PAGES.some(function (p) { return p.id === parts[0]; }) ? parts[0] : "overview";
    var item = parts[1] ? decodeURIComponent(parts[1]) : null;
    if (item && sel.hasOwnProperty(page)) { sel[page] = item; RENDER[page](); afterRender($("#page-" + page)); }
    current = page;
    PAGES.forEach(function (p) { $("#page-" + p.id).hidden = p.id !== page; });
    var meta = PAGES.filter(function (p) { return p.id === page; })[0];
    $("#crumb").textContent = meta.label; $("#page-title").textContent = meta.label;
    document.title = meta.label + " · Nudge Sense";
    renderNav(page);
    var target = item ? ($("#" + page + "-detail") || $("#page-" + page)) : (page === "trend" && parts[1] === "heatmap" ? $("#trend-heatmap") : null);
    if (target) { target.scrollIntoView({ behavior: "smooth", block: "start" }); V.flash(target); } else window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  /* Split-view picks navigate through the router so links stay shareable */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-pick]");
    if (b) { location.hash = "#/" + b.dataset.pick + "/" + encodeURIComponent(b.dataset.id); return; }
    var a = e.target.closest("#agent a.ilink");
    if (a) $("#app").classList.remove("agent-open");
  });

  /* ---------- Compare & agent panel ---------- */
  $("#compare").addEventListener("change", function (e) { compareRun = runs.filter(function (r) { return String(r.n) === e.target.value; })[0] || null; renderAll(); route(); });
  var app = $("#app");
  function narrow() { return window.matchMedia("(max-width: 1200px)").matches; }
  function setCollapsed(v) { app.classList.toggle("agent-collapsed", v); try { localStorage.setItem("voc-agent-collapsed", v ? "1" : "0"); } catch (e) {} }
  try { if (localStorage.getItem("voc-agent-collapsed") === "1") app.classList.add("agent-collapsed"); } catch (e) {}
  $("#agent-toggle").addEventListener("click", function () { if (narrow()) app.classList.toggle("agent-open"); else setCollapsed(!app.classList.contains("agent-collapsed")); });
  $("#agent-close").addEventListener("click", function () { if (narrow()) app.classList.remove("agent-open"); else setCollapsed(true); });
  $("#scrim").addEventListener("click", function () { app.classList.remove("agent-open"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") app.classList.remove("agent-open"); });

  V.initTheme();
  renderAll();
  route();
})();
</script>
</body>
</html>
